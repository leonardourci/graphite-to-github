<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Left to right: a stack (Graphite), an arrow, GitHub's Octocat. The story
       the extension tells, in that order.

       NOTE ON THE OCTOCAT: GitHub's logo policy asks that their mark not be used
       in an app icon or as part of another product's branding, and borrowed
       branding is a documented Chrome Web Store rejection reason. This is a
       deliberate owner decision, not an oversight -- two original-cat drafts were
       tried and neither read as a cat. If the listing is rejected on branding,
       swapping the <g> below for original artwork fixes it without touching any
       other file.

       The Octocat path is duplicated from content.js. Two copies of one constant
       beats a build step for a no-build extension.

       Flat on purpose: a gradient plus a translucent inner "glass" stroke is the
       generated-app-icon cliche and neither survives 16px. At 16px the stack bars
       reduce to specks; the cat still carries it.

       The arrow is GitHub's accent blue and it is the only coloured element. On a
       dark browser theme the tile edge disappears, so the accent is what keeps
       the icon findable in the toolbar -- an all-grey version dissolves. Going
       darker than this reads richer at 128 and sinks into the tile at 16. -->
  <rect width="128" height="128" rx="24" fill="#22272e"/>

  <!-- Stack: outer layers dimmed, middle layer solid and leaving as the arrow. -->
  <rect x="12" y="40" width="22" height="10" rx="5" fill="#fff" fill-opacity=".45"/>
  <rect x="12" y="63" width="20" height="10" rx="5" fill="#2f81f7"/>
  <path d="M28 57 44 68 28 79z" fill="#2f81f7"/>
  <rect x="12" y="86" width="18" height="10" rx="5" fill="#fff" fill-opacity=".45"/>

  <g transform="translate(52 40) scale(3.5)">
    <path fill="#fff" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
  </g>
</svg>
